services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvscanner
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d cvscanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: